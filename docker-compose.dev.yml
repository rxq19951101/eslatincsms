#
# 开发环境 Docker Compose 配置（端口与主栈错开；数据库账号与生产一致 ocpp_user）
# 使用端口: CSMS:8000, Admin:3001, DB:5433, Redis:6380, MQTT:1884/9002
# 使用: docker compose -f docker-compose.dev.yml up -d
# 若曾用旧版 local 用户初始化过卷，需: docker compose -f docker-compose.dev.yml down -v 后重建
#

services:
  db:
    image: postgres:15-alpine
    container_name: ocpp-db-dev
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=ocpp_user
      - POSTGRES_PASSWORD=ocpp_password
      - POSTGRES_DB=ocpp
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - ocppnet-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocpp_user -d ocpp"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ocpp-redis-dev
    ports:
      - "6380:6379"
    command: redis-server --appendonly no --save "" --stop-writes-on-bgsave-error no
    volumes:
      - redis_data_dev:/data
    networks:
      - ocppnet-dev
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: ocpp-mqtt-dev
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - mqtt_data_dev:/mosquitto/data
      - mqtt_log_dev:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - ocppnet-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t test -m 'healthcheck' && mosquitto_sub -h localhost -t test -C 1 -W 2 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  csms:
    build: ./csms
    container_name: ocpp-csms-dev
    ports:
      - "8000:9000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://ocpp_user:ocpp_password@db:5432/ocpp
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - CORS_ORIGINS=http://localhost:3001,http://localhost:3002,http://localhost:3000
      - LOG_LEVEL=DEBUG
      - DOCS_URL=/docs
      - REDOC_URL=/redoc
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt-broker:
        condition: service_started
    networks:
      - ocppnet-dev
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAP_ID:-}
        NEXT_PUBLIC_CSMS_HTTP: ${NEXT_PUBLIC_CSMS_HTTP:-http://localhost:8000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: ocpp-admin-dev
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_CSMS_HTTP=${NEXT_PUBLIC_CSMS_HTTP:-http://localhost:8000}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - csms
    networks:
      - ocppnet-dev
    restart: unless-stopped

volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  mqtt_data_dev:
    driver: local
  mqtt_log_dev:
    driver: local

networks:
  ocppnet-dev:
    driver: bridge
