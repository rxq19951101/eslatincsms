#
# 本地默认栈：数据库账号与 CSMS 运行方式与生产一致（ocpp_user / 生产级 env）
# 启动: docker compose up -d --build
# 端口: CSMS 9000, Admin 3000, Postgres 5432, Redis 6379, OCPP WebSocket 9000/ocpp
#
# Admin 的 NEXT_PUBLIC_* 在「构建」时注入：Compose 只从「仓库根目录」的 .env 读取 ${VAR}。
# 若密钥只在 admin/.env.local（给 npm run dev 用），Docker 构建不到，请复制一行到根 .env，或：
#   docker compose --env-file admin/.env.local build admin
#

services:
  db:
    image: postgres:15-alpine
    container_name: ocpp-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ocpp_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ocpp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ocppnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocpp_user -d ocpp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ocpp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis_data:/data
    networks:
      - ocppnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  csms:
    build: ./csms
    container_name: ocpp-csms
    ports:
      - "9000:9000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://ocpp_user:${POSTGRES_PASSWORD}@db:5432/ocpp
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - CSMS_BOOTSTRAP_SUPER_ADMIN_PASSWORD=${CSMS_BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      - CSMS_BOOTSTRAP_TENANT_ADMIN_PASSWORD=${CSMS_BOOTSTRAP_TENANT_ADMIN_PASSWORD:-}
      - ENCRYPTION_SALT=ocpp_local_development_salt
      - OCPP_WS_REQUIRE_PRE_REGISTERED=true
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      # Expo Web（localhost:8081）→ CSMS :9000 跨域；未设置时 main.py 默认已含 8081，此处可覆盖扩展
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:8081,http://127.0.0.1:8081,http://localhost:19006,http://127.0.0.1:19006
      - DOCS_URL=None
      - REDOC_URL=None
      - ENABLE_WEBSOCKET_TRANSPORT=true
      - ENABLE_HTTP_TRANSPORT=false
      # TEST 凭证与 MP 官方测试卡配套使用
      - MERCADOPAGO_ENVIRONMENT=sandbox
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN:-}
      - MERCADOPAGO_PUBLIC_KEY=${MERCADOPAGO_PUBLIC_KEY:-}
      - MERCADOPAGO_APP_ID=${MERCADOPAGO_APP_ID:-}
      - MERCADOPAGO_CLIENT_SECRET=${MERCADOPAGO_CLIENT_SECRET:-}
      - MERCADOPAGO_WEBHOOK_SECRET=${MERCADOPAGO_WEBHOOK_SECRET:-}
      - SIM_E2E_WEBHOOK_SECRET=${SIM_E2E_WEBHOOK_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ocppnet
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  admin:
    build:
      context: ./admin
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAP_ID:-}
        NEXT_PUBLIC_CSMS_HTTP: ${NEXT_PUBLIC_CSMS_HTTP:-http://localhost:9000}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:9000}
    container_name: ocpp-admin
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CSMS_HTTP=${NEXT_PUBLIC_CSMS_HTTP:-http://localhost:9000}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:9000}
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - csms
    networks:
      - ocppnet
    restart: unless-stopped

  charger-sim:
    profiles: ["simulator"]
    build: ./charger-sim
    container_name: ocpp-charger-sim
    depends_on:
      - csms
    networks:
      - ocppnet
    command:
      [
        "python",
        "cli.py",
        "run-one",
        "--ws",
        "ws://csms:9000/ocpp",
        "--charge-point-id",
        "${SIM_OCPP_IDENTITY:-SIM-E2E-CP-001}",
        "--connector-id",
        "1",
      ]
    restart: unless-stopped

  manual-charger-sim:
    profiles: ["manual-simulator"]
    build: ./charger-sim
    container_name: ocpp-manual-charger-sim
    depends_on:
      csms:
        condition: service_healthy
    networks:
      - ocppnet
    command:
      [
        "python",
        "cli.py",
        "run-one",
        "--ws",
        "ws://csms:9000/ocpp",
        "--ocpp-identity",
        "${MANUAL_SIM_OCPP_IDENTITY:-CO.BOGOTA:MANUAL-CP-001}",
        "--ocpp-secret",
        "${MANUAL_SIM_OCPP_SECRET:-}",
        "--connector-id",
        "1",
        "--vendor",
        "EsLatin",
        "--model",
        "Manual-AC-7kW",
        "--serial-number",
        "ESL-MANUAL-SIM-001",
        "--firmware-version",
        "1.0.0",
        "--heartbeat-interval",
        "30",
        "--meter-interval",
        "5",
        "--power-kw",
        "7",
        "--voltage-v",
        "220",
        "--current-a",
        "32",
      ]
    restart: "no"

  charger-scenario:
    profiles: ["e2e"]
    build: ./charger-sim
    container_name: ocpp-charger-scenario
    depends_on:
      - csms
    networks:
      - ocppnet
    environment:
      - SIM_API_BASE=${SIM_API_BASE:-http://csms:9000}
      - SIM_OCPP_WS=${SIM_OCPP_WS:-ws://csms:9000/ocpp}
      - SIM_E2E_ADMIN_PASSWORD=${SIM_E2E_ADMIN_PASSWORD}
      - SIM_E2E_APP_PASSWORD=${SIM_E2E_APP_PASSWORD}
      - SIM_E2E_READONLY_PASSWORD=${SIM_E2E_READONLY_PASSWORD}
      - SIM_E2E_WEBHOOK_SECRET=${SIM_E2E_WEBHOOK_SECRET}
    command:
      [
        "python",
        "cli.py",
        "scenario",
        "run",
        "${SIM_SCENARIO:-scenarios/p0/reconnect.yml}",
        "--report-dir",
        "reports",
        "--seed-json",
        "/run/sim-e2e-seed.json",
      ]
    volumes:
      - ./charger-sim/reports:/app/reports
      - ${SIM_SEED_JSON_HOST:-./charger-sim/seed.sim-e2e.json}:/run/sim-e2e-seed.json:ro
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ocppnet:
    driver: bridge
