# Mosquitto MQTT Broker 配置文件
# 本地开发 Broker 配置。生产环境使用 mosquitto.prod.conf。

# TCP 监听器
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket 监听器
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# 日志
log_dest stdout
log_type all

# 持久化
persistence true
persistence_location /mosquitto/data/
