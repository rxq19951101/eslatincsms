#
# 仅 CSMS + 依赖（DB / Redis / MQTT），无 Admin、无 charger-sim
# 启动: docker compose -f docker-compose.csms-only.yml up -d --build
# 数据库账号与主栈一致: ocpp_user / ocpp_password（独立数据卷，避免与 docker-compose.yml 冲突）
#

services:
  db:
    image: postgres:15-alpine
    container_name: ocpp-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ocpp_user
      - POSTGRES_PASSWORD=ocpp_password
      - POSTGRES_DB=ocpp
    volumes:
      - postgres_data_csms_only:/var/lib/postgresql/data
    networks:
      - ocppnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocpp_user -d ocpp"]
      interval: 5s
      timeout: 3s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ocpp-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly no --save "" --stop-writes-on-bgsave-error no
    networks:
      - ocppnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - ocppnet
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t test -m test || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  csms:
    build: ./csms
    container_name: ocpp-csms
    ports:
      - "9000:9000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql://ocpp_user:ocpp_password@db:5432/ocpp
      - REDIS_URL=redis://redis:6379/0
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-ocpp-local-encryption-key-change-in-production}
      - SECRET_KEY=${SECRET_KEY:-ocpp-local-secret-key-change-in-production-please}
      - ENCRYPTION_SALT=ocpp_csms_salt
      - MQTT_BROKER_HOST=mqtt-broker
      - MQTT_BROKER_PORT=1883
      - ENABLE_WEBSOCKET_TRANSPORT=true
      - DOCS_URL=None
      - REDOC_URL=None
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      mqtt-broker:
        condition: service_healthy
    networks:
      - ocppnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_csms_only:
    driver: local

networks:
  ocppnet:
    driver: bridge
